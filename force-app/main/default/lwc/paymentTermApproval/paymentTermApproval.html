<template>
    <div class="arelia-container">

        <template if:true={isLoading}>
            <lightning-spinner
                alternative-text="Loading"
                size="medium"
                variant="brand"
                class="submit-spinner">
            </lightning-spinner>
        </template>

        <template if:true={error}>
            <div class="slds-notify slds-notify_alert slds-theme_error error-alert" role="alert">
                <h2>{error}</h2>
            </div>
        </template>

        <template if:true={approvalData}>
            <div class="animate-fade-in fade-delay-one">
                <h1 class="main-title">{userType} Ledger Sign-Off</h1>
                <p class="main-subtitle">Project Reference // {approvalData.opportunity.Name}</p>
            </div>

            <div class="arelia-card terms-card animate-fade-in fade-delay-two">
                <div class="installment-panel">
                    <div class="installment-header">
                        <div class="installment-header-cell installment-no-cell">
                            No.
                        </div>

                        <div class="installment-header-cell">
                            Term Name
                        </div>

                        <div class="installment-header-cell installment-center">
                            Split
                        </div>

                        <div class="installment-header-cell installment-date-cell">
                            Fulfillment Date
                        </div>
                    </div>

                    <template for:each={terms} for:item="term">
                        <div key={term.Id} class="installment-row">
                            <div class="installment-cell installment-no-cell">
                                <span class="installment-number">
                                    0{term.serialNumber}
                                </span>
                            </div>

                            <div class="installment-cell installment-term-cell">
                                <span class="installment-term-name">
                                    {term.Term_Label__c}
                                </span>
                            </div>

                            <div class="installment-cell installment-center">
                                <span class="installment-percentage">
                                    {term.Percentage__c}%
                                </span>
                            </div>

                            <div class="installment-cell installment-date-cell">
                                <lightning-formatted-date-time
                                    value={term.Due_Date__c}
                                    month="short"
                                    day="2-digit"
                                    year="numeric">
                                </lightning-formatted-date-time>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <div class="arelia-card action-card slds-text-align_center animate-fade-in fade-delay-three">

                <template if:false={isProcessed}>

                    <template if:false={showCommentBox}>
                        <div class="button-container animate-fade-in">
                            <button class="arelia-btn btn-approve" onclick={handleApproveClick}>
                                <lightning-icon
                                    icon-name="utility:check"
                                    size="small"
                                    class="button-icon approve-icon slds-m-right_x-small">
                                </lightning-icon>
                                Authorize Terms
                            </button>

                            <button class="arelia-btn btn-request" onclick={handleRequestChangesClick}>
                                <lightning-icon
                                    icon-name="utility:close"
                                    size="small"
                                    class="button-icon request-icon slds-m-right_x-small">
                                </lightning-icon>
                                Request Amendment
                            </button>
                        </div>
                    </template>

                    <template if:true={showCommentBox}>
                        <div class="comment-box-container animate-fade-in">
                            <label class="amendment-label" for="amendmentComments">
                                <abbr class="required-symbol" title="required">*</abbr>
                                Amendment Details
                            </label>

                            <textarea
                                id="amendmentComments"
                                class="native-amendment-textarea"
                                value={comments}
                                oninput={handleCommentChange}
                                placeholder="Enter specific revision instructions here..."
                                required>
                            </textarea>

                            <div class="button-container amendment-button-container slds-m-top_medium">
                                <button class="arelia-btn btn-back" onclick={handleBackClick}>
                                    Back
                                </button>

                                <button class="arelia-btn btn-submit-changes" onclick={handleRejectClick}>
                                    Submit Amendment
                                </button>
                            </div>
                        </div>
                    </template>
                </template>

                <template if:true={isProcessed}>
                    <div class="info-box">
                        <h2>Ledger Sealed</h2>
                        <p class="processed-message">
                            The authorization for this project has already been finalized.
                        </p>
                    </div>
                </template>
            </div>
        </template>

        <template if:true={showSuccessModal}>
            <div class="custom-modal-backdrop">
                <section class="custom-modal-box" role="dialog" aria-modal="true">
                    <div class="success-icon">
                        ✓
                    </div>

                    <h2 class="success-title">
                        Success
                    </h2>

                    <p class="success-message">
                        {successMessage}
                    </p>

                    <button class="arelia-btn btn-approve return-btn" onclick={handleNavigateHome}>
                        Return to Portal
                    </button>
                </section>
            </div>
        </template>
    </div>
</template>
