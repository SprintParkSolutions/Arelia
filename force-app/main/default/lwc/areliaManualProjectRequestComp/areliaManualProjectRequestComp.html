<template>
    <div class="form-wrapper animate-fade-in">
        <template if:true={showForm}>
            <section class="center-card">
                
                <!-- 1. HEADER PARTITION -->
                <header class="card-header-section">
                    <div class="header-pill animate-slide-up">Arelia Project Request</div>
                    <h1 class="title animate-slide-up">Interior Project Request - Manual</h1>
                    <p class="subtitle animate-slide-up">
                        Please verify your details and share more information about your project so that we can prepare a customised quotation.
                    </p>
                </header>

                <!-- 2. BODY PARTITION -->
                <div class="card-body-section custom-form-theme">
                    
                    <!-- Form Section Title -->
                    <div class="form-section-title">
                        <h2>Customer Details</h2>
                        <p>These details are stored on your Lead and used for communication.</p>
                    </div>

                    <div class="slds-grid slds-wrap slds-gutters custom-grid-spacing">
                        
                        <!-- First Name -->
                        <div class="slds-col slds-small-size_1-of-1 slds-medium-size_1-of-2">
                            <div class="field-card">
                                <lightning-input label="First Name" value={firstName} onchange={handleChange}
                                    name="firstName" readonly class="luxury-input"></lightning-input>
                            </div>
                        </div>

                        <!-- Last Name -->
                        <div class="slds-col slds-small-size_1-of-1 slds-medium-size_1-of-2">
                            <div class="field-card">
                                <lightning-input label="Last Name" value={lastName} onchange={handleChange} name="lastName"
                                    readonly class="luxury-input"></lightning-input>
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="slds-col slds-small-size_1-of-1 slds-medium-size_1-of-2">
                            <div class="field-card">
                                <lightning-input label="Email" type="email" value={email} onchange={handleChange}
                                    name="email" readonly class="luxury-input"></lightning-input>
                            </div>
                        </div>

                        <!-- Phone -->
                        <div class="slds-col slds-small-size_1-of-1 slds-medium-size_1-of-2">
                            <div class="field-card">
                                <lightning-input label="Phone" type="tel" value={phone} readonly class="luxury-input">
                                </lightning-input>
                            </div>
                        </div>

                        <!-- Company -->
                        <div class="slds-col slds-small-size_1-of-1 slds-medium-size_1-of-2">
                            <div class="field-card">
                                <lightning-input label="Company Name" value={company} placeholder="e.g. Self-Bhavana"
                                    onchange={handleChange} name="company" class="luxury-input"></lightning-input>
                            </div>
                        </div>

                        <!-- Site Space -->
                        <div class="slds-col slds-small-size_1-of-1 slds-medium-size_1-of-2">
                            <div class="field-card">
                                <lightning-input label="Total Site Space (sq.ft.)" type="number" value={siteSpace} name="siteSpace"
                                    placeholder="Enter area" onchange={handleChange} class="luxury-input">
                                </lightning-input>
                            </div>
                        </div>

                        <!-- Type of Project -->
                        <div class="slds-col slds-small-size_1-of-1 slds-medium-size_1-of-2">
                            <div class="field-card">
                                <lightning-combobox name="typeOfProject" label="Type of Project" value={typeOfProject}
                                    placeholder="Select Project Type" options={projectTypeOptions}
                                    onchange={handleChange} class="luxury-input"></lightning-combobox>
                            </div>
                        </div>

                        <!-- Project Scope -->
                        <div class="slds-col slds-small-size_1-of-1 slds-medium-size_1-of-2">
                            <div class="field-card">
                                <lightning-combobox name="projectScope" label="Project Scope" value={projectScope}
                                    placeholder="Select Project Scope" options={projectScopeOptions} onchange={handleChange}
                                    disabled={isScopeDisabled} class="luxury-input"></lightning-combobox>
                            </div>
                        </div>

                        <!-- Plan Level -->
                        <div class="slds-col slds-small-size_1-of-1 slds-medium-size_1-of-2">
                            <div class="field-card">
                                <lightning-combobox name="planLevel" label="Plan Level" value={planLevel} placeholder="Select Plan Level"
                                    options={planLevelOptions} onchange={handleChange} class="luxury-input">
                                </lightning-combobox>
                            </div>
                        </div>

                        <!-- Budget -->
                        <div class="slds-col slds-small-size_1-of-1 slds-medium-size_1-of-2">
                            <div class="field-card">
                                <lightning-input label="Budget (INR)" type="number" value={budget} placeholder="Enter Budget"
                                    onchange={handleChange} name="budget" class="luxury-input"></lightning-input>
                            </div>
                        </div>

                        <!-- Site Location -->
                        <div class="slds-col slds-small-size_1-of-1 slds-medium-size_1-of-2">
                            <div class="field-card text-area-card">
                                <lightning-textarea label="Full Address" value={siteLocation}
                                    placeholder="Full address of project site" onchange={handleChange}
                                    name="siteLocation" class="luxury-input custom-textarea"></lightning-textarea>
                            </div>
                        </div>

                        <!-- Project Description -->
                        <div class="slds-col slds-small-size_1-of-1 slds-medium-size_1-of-2">
                            <div class="field-card text-area-card">
                                <lightning-textarea label="Project Notes / Expectations" value={projectDescription}
                                    placeholder="Tell us about your space and expectations"
                                    onchange={handleChange} name="projectDescription" class="luxury-input custom-textarea"></lightning-textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Footer Panel -->
                    <footer class="footer-panel">
                        <div class="footer-summary">
                            <span class="summary-label">Project Type:</span>
                            <span class="summary-value quote-pill">{quotationTypeLabel}</span>
                        </div>

                        <div class="footer-actions">
                            <button class="btn-outline" onclick={goToPrevious}>Previous</button>
                            <button class="btn-luxury" onclick={submitLead}>Next</button>
                        </div>
                    </footer>
                </div>
            </section>
        </template>

        <!-- SUCCESS SCREEN (Kept styled to match new theme) -->
        <template if:true={showSuccess}>
            <div class="center-card success-card animate-fade-in">
                <div class="card-header-section text-center">
                    <div class="success-icon-wrapper animate-slide-up">
                        <span class="checkmark">✓</span>
                    </div>
                    <h2 class="title animate-slide-up">Request Received</h2>
                </div>
                <div class="card-body-section text-center" style="padding-bottom:4rem;">
                    <p style="margin-bottom: 2rem; color: #555;">
                        Your project details have been successfully submitted. Our design team will review your requirements and share a customised quotation with you shortly.
                    </p>
                    <button class="btn-luxury btn-wide" onclick={handleCloseSuccess}>Return to Portal</button>
                </div>
            </div>
        </template>
        <!-- LUXURY POPUP OVERLAY (For Custom Template/Manual Request) -->
        <template if:true={showSubmittedPopup}>
            <div class="popup-overlay animate-fade-in">
                <div class="popup-card animate-scale-up">
                    
                    <!-- Premium Gold Icon -->
                    <div class="popup-icon-wrapper">
                        <svg class="popup-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                    </div>

                    <!-- Text Content -->
                    <h2 class="popup-title">Project Request Submitted</h2>
                    <p class="popup-message">
                        Lead details already submitted. If you have any queries contact Arelia Team.
                    </p>

                    <!-- Luxury Button -->
                    <button class="btn-popup-close" onclick={closePopup}>
                        Close
                    </button>

                </div>
            </div>
        </template>
    </div>
</template>
