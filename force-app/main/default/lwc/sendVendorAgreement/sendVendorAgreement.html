<template>
    <lightning-quick-action-panel
        header="Send Vendor Agreement">

        <template if:true={isLoading}>
            <lightning-spinner
                alternative-text="Loading Vendor Agreement">
            </lightning-spinner>
        </template>

        <div class="slds-p-around_medium">

            <lightning-input
                label="Vendor"
                value={vendorName}
                disabled>
            </lightning-input>

            <lightning-input
                class="slds-m-top_small"
                label="Vendor Email"
                value={vendorEmail}
                disabled>
            </lightning-input>

            <div class="slds-m-top_medium">

                <!-- EDIT MODE -->
                <template if:true={isEditing}>

                    <!--
                        Protected logo.

                        This is intentionally outside
                        lightning-input-rich-text so the user cannot
                        delete it with Backspace, Delete, Ctrl+A, etc.
                    -->
                    <div class="protected-brand-header">
                        <img
                            src={areliaLogoUrl}
                            alt="Arelia Space"
                            class="arelia-agreement-logo"
                            draggable="false"
                        />
                    </div>

                    <lightning-input-rich-text
                        value={editableAgreementHtml}
                        formats={formats}
                        onchange={handleAgreementChange}>
                    </lightning-input-rich-text>
                </template>

                <!-- PREVIEW MODE -->
                <!--<template if:false={isEditing}>

                    <div class="agreement-preview">

                        <div class="protected-brand-header">
                            <img
                                src={areliaLogoUrl}
                                alt="Arelia Space"
                                class="arelia-agreement-logo"
                                draggable="false"
                            />
                        </div>

                        <lightning-formatted-rich-text
                            value={previewAgreementBodyHtml}>
                        </lightning-formatted-rich-text>

                    </div>

                </template>-->

                <!-- PREVIEW MODE -->
                <template if:false={isEditing}>

                    <div class="agreement-preview">

                        <!-- Protected Arelia Logo -->
                        <div class="protected-brand-header">
                            <img
                                src={areliaLogoUrl}
                                alt="Arelia Space"
                                class="arelia-agreement-logo"
                                draggable="false"
                            />
                        </div>

                        <!--
                            Agreement preview is rendered manually so the modal can
                            use the same visual styling as the Vendor Agreement PDF.
                            Agreement_HTML__c itself is NOT modified.
                        -->
                        <div
                            class="modal-agreement-content"
                            lwc:dom="manual">
                        </div>

                    </div>

                </template>

            </div>

        </div>

        <div slot="footer">
            <lightning-button
                label="Cancel"
                onclick={handleCancel}>
            </lightning-button>

            <template if:false={isEditing}>
                <lightning-button
                    class="slds-m-left_small"
                    label="Edit"
                    onclick={handleEdit}>
                </lightning-button>
            </template>

            <template if:true={isEditing}>
                <lightning-button
                    class="slds-m-left_small"
                    label="Save"
                    onclick={handleSave}>
                </lightning-button>
            </template>

            <lightning-button
                class="slds-m-left_small"
                variant="brand"
                label="Send"
                onclick={handleSend}>
            </lightning-button>
        </div>

    </lightning-quick-action-panel>
</template>
