<template>
    <lightning-card title="Password Actions">

        <div class="slds-p-around_medium">

            <p>Select an action:</p>

            <div class="slds-m-top_medium">

                <lightning-button
                    label="Set Password (New User)"
                    variant="brand"
                    onclick={handleSet}>
                </lightning-button>

                <lightning-button
                    label="Forgot Password"
                    class="slds-m-left_small"
                    onclick={handleForgot}>
                </lightning-button>

            </div>

            <template if:true={processing}>
                <div class="slds-m-top_medium">
                    <lightning-spinner alternative-text="Processing"></lightning-spinner>
                </div>
            </template>

            <template if:true={successMessage}>
                <p class="slds-text-color_success slds-m-top_medium">
                    {successMessage}
                </p>
            </template>

        </div>
    </lightning-card>
</template>
