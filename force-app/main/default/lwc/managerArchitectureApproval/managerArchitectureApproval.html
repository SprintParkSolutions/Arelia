<template>
    <div class="arelia-container">

        <template if:true={isLoading}>
            <lightning-spinner
                alternative-text="Processing..."
                size="medium"
                variant="brand"
                class="submit-spinner">
            </lightning-spinner>
        </template>

        <template if:true={error}>
            <div class="error-alert" role="alert">
                <strong>Error:</strong> {error}
            </div>
        </template>

        <template if:false={designData}>
            <template if:false={error}>
                <div class="loading-box">
                    <lightning-spinner
                        alternative-text="Loading Design..."
                        size="medium"
                        variant="brand">
                    </lightning-spinner>
                </div>
            </template>
        </template>

        <template if:true={designData}>
            <div class="page-header-content animate-fade-in fade-delay-one">
                <div class="eyebrow">Manager Architecture Review</div>

                <h1 class="main-title">Manager Sign-Off</h1>

                <p class="main-subtitle">
                    Reviewing <strong>{designData.projectName}</strong>. The client has approved this design.
                    Your final authorization is required to proceed.
                </p>
            </div>

            <div class="arelia-card animate-fade-in fade-delay-two">
                <div class="card-inner-content">
                    <h2 class="card-title">Submit Decision</h2>

                    <div class="status-panel">
                        <div class="status-icon-wrap">
                            <lightning-icon
                                icon-name="utility:success"
                                size="small"
                                class="client-success-icon">
                            </lightning-icon>
                        </div>

                        <div class="status-content">
                            <p class="client-status-label">Client Status</p>
                            <p class="value-text success-text">Approved by {designData.clientName}</p>
                            <p class="sub-label">on {designData.clientApprovedDate}</p>
                        </div>
                    </div>

                    <div class="note-box">
                        <lightning-icon
                            icon-name="utility:warning"
                            size="medium"
                            class="note-icon">
                        </lightning-icon>

                        <p>
                            <strong>Compliance Check:</strong>
                            Ensure all structural safety regulations are met before signing off.
                        </p>
                    </div>

                    <template if:true={isFinalized}>
                        <div class="final-status-box animate-fade-in">
                            <div class={decisionClass}>
                                Manager Decision: {decisionText}
                            </div>

                            <template if:true={hasManagerComments}>
                                <p class="manager-comments">
                                    “{designData.comments}”
                                </p>
                            </template>

                            <p class="final-message">
                                This manager decision has already been submitted.
                            </p>
                        </div>
                    </template>

                    <template if:true={isActionAllowed}>
                        <template if:false={showCommentBox}>
                            <div class="button-container animate-fade-in">
                                <button class="arelia-btn btn-approve" onclick={handleApproveClick}>
                                    <lightning-icon
                                        icon-name="utility:check"
                                        size="small"
                                        class="button-icon approve-icon">
                                    </lightning-icon>
                                    Final Sign-Off
                                </button>

                                <button class="arelia-btn btn-request" onclick={handleRequestChangesClick}>
                                    <lightning-icon
                                        icon-name="utility:close"
                                        size="small"
                                        class="button-icon request-icon">
                                    </lightning-icon>
                                    Reject / Revise
                                </button>
                            </div>
                        </template>

                        <template if:true={showCommentBox}>
                            <div class="comment-box-container animate-fade-in">
                                <label class="manager-remarks-label" for="managerRemarks">
                                    <abbr class="required-symbol" title="required">*</abbr>
                                    Manager Remarks / Revision Notes
                                </label>

                                <textarea
                                    id="managerRemarks"
                                    class="native-manager-textarea"
                                    value={comments}
                                    oninput={handleCommentChange}
                                    placeholder="Enter the revision notes clearly for the design team..."
                                    required>
                                </textarea>

                                <div class="button-container amendment-button-container">
                                    <button class="arelia-btn btn-back" onclick={handleBackClick}>
                                        Back
                                    </button>

                                    <button class="arelia-btn btn-submit-changes" onclick={handleSubmitRejectionClick}>
                                        Submit Decision
                                    </button>
                                </div>
                            </div>
                        </template>
                    </template>
                </div>
            </div>
        </template>

        <template if:true={showConfirmationModal}>
            <div class="custom-modal-backdrop">
                <section class="custom-modal-box" role="dialog" aria-modal="true">
                    <div class="modal-icon">?</div>

                    <h2 class="modal-title">Confirmation</h2>

                    <p class="modal-message">
                        {confirmationMessage}
                    </p>

                    <div class="modal-button-row">
                        <button class="arelia-btn btn-cancel" onclick={closeConfirmationModal}>
                            No, Cancel
                        </button>

                        <button class="arelia-btn btn-approve" onclick={handleConfirmYes}>
                            Yes, Confirm
                        </button>
                    </div>
                </section>
            </div>
        </template>

        <template if:true={showSuccessModal}>
            <div class="custom-modal-backdrop">
                <section class="custom-modal-box success-modal-box" role="dialog" aria-modal="true">
                    <div class="success-icon">✓</div>

                    <h2 class="success-title">Success</h2>

                    <p class="success-message">
                        {successMessage}
                    </p>

                    <button class="arelia-btn btn-approve return-btn" onclick={handleSuccessClose}>
                        Close
                    </button>
                </section>
            </div>
        </template>

    </div>
</template>
