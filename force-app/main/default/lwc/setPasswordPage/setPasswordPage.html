<template>
    <div class="password-page">

        <template if:true={isCheckingToken}>
            <div class="loading-panel">
                <lightning-spinner
                    alternative-text="Validating password link"
                    size="medium"
                    variant="brand">
                </lightning-spinner>

                <p class="loading-text">
                    Validating Link...
                </p>
            </div>
        </template>

        <template if:true={isSubmitting}>
            <div class="processing-backdrop">
                <div class="processing-box">
                    <lightning-spinner
                        alternative-text="Creating password"
                        size="medium"
                        variant="brand">
                    </lightning-spinner>

                    <p class="processing-title">
                        Creating Password
                    </p>

                    <p class="processing-text">
                        Please wait while we securely save your password.
                    </p>
                </div>
            </div>
        </template>

        <template if:false={isCheckingToken}>
            <template if:true={isValidToken}>
                <template if:false={showModal}>
                    <section class="password-card">
                        <div class="card-header">
                            <div class="header-badge">
                                Arelia Mobile Access
                            </div>

                            <h1 class="title">
                                Set Your Password
                            </h1>

                            <p class="subtitle">
                                Create a secure password to access your Arelia mobile application
                                and track your project progress.
                            </p>
                        </div>

                        <div class="card-body">
                            <div class="section-title-row">
                                <h2>Password Details</h2>
                                <span class="section-line"></span>
                            </div>

                            <div class="form-grid">
                                <div class="field-cell">
                                    <lightning-input
                                        type={passwordType}
                                        label="New Password"
                                        value={password}
                                        onchange={handleChange}
                                        class="input"
                                        data-id="newPassword">
                                    </lightning-input>
                                </div>

                                <div class="field-cell">
                                    <lightning-input
                                        type={passwordType}
                                        label="Confirm Password"
                                        value={confirmPassword}
                                        onchange={handleConfirmChange}
                                        class="input"
                                        data-id="confirmPassword">
                                    </lightning-input>
                                </div>
                            </div>

                            <div class="strength-panel">
                                <div class="strength-header">
                                    <span>Password Strength</span>

                                    <template if:true={hasStrengthText}>
                                        <strong>{strengthText}</strong>
                                    </template>
                                </div>

                                <div class="strength-bar">
                                    <div class={strengthClass}></div>
                                </div>
                            </div>

                            <div class="rules-container">
                                <div class="rules-title-row">
                                    <p class="rules-title">
                                        Password must contain
                                    </p>
                                    <span class="rules-line"></span>
                                </div>

                                <ul class="rules">
                                    <li class={ruleLength}>
                                        <span class="icon"></span>
                                        <span>At least 6 characters</span>
                                    </li>

                                    <li class={ruleNumber}>
                                        <span class="icon"></span>
                                        <span>Contains a number</span>
                                    </li>

                                    <li class={ruleUpper}>
                                        <span class="icon"></span>
                                        <span>Contains uppercase letter</span>
                                    </li>

                                    <li class={ruleSpecial}>
                                        <span class="icon"></span>
                                        <span>Contains special character ($%@#!^&*)</span>
                                    </li>
                                </ul>
                            </div>

                            <div class="toggle-panel">
                                <lightning-input
                                    type="checkbox"
                                    label="Show Password"
                                    onchange={togglePassword}>
                                </lightning-input>
                            </div>

                            <template if:true={hasMessage}>
                                <div class="error-box">
                                    {message}
                                </div>
                            </template>

                            <button class="btn" onclick={handleSubmit}>
                                Set Password
                            </button>
                        </div>
                    </section>
                </template>
            </template>

            <template if:false={isValidToken}>
                <section class="status-card error-status-card">
                    <div class="status-icon error-status-icon">
                        !
                    </div>

                    <p class="status-eyebrow">
                        Password Link Status
                    </p>

                    <h1>
                        Unable to Continue
                    </h1>

                    <p>
                        {message}
                    </p>
                </section>
            </template>
        </template>

        <template if:true={showModal}>
            <div class="modal-backdrop">
                <div class="modal-container">
                    <div class="success-icon">
                        ✓
                    </div>

                    <p class="modal-eyebrow">
                        Password Status
                    </p>

                    <h2 class="modal-title">
                        Password Created!
                    </h2>

                    <p class="modal-text">
                        Your password has been successfully created. You can now use it
                        to track your project progress in the Arelia mobile application.
                    </p>

                    <button class="modal-btn" onclick={closeModal}>
                        Close
                    </button>
                </div>
            </div>
        </template>

    </div>
</template>
