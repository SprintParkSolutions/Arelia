<template>
    <div class="container">
        <div class="card">

            <h1 class="title">Set Your Password</h1>

            <!-- Form -->
            <template if:true={isValidToken}>
                <template if:false={showModal}>

                    <!-- ✅ Strength Indicator -->
                    <div class="strength-container">
                        <div class="strength-bar">
                            <div class={strengthClass}></div>
                        </div>
                        <p class="strength-text">{strengthText}</p>
                    </div>

                    <lightning-input
                        type={passwordType}
                        label="New Password"
                        value={password}
                        onchange={handleChange}
                        class="input"
                        data-id="newPassword">
                    </lightning-input>
                    
                    <lightning-input
                        type={passwordType}
                        label="Confirm Password"
                        value={confirmPassword}
                        onchange={handleConfirmChange}
                        class="input"
                        data-id="confirmPassword">
                    </lightning-input>

                    <!-- ✅ Rules -->
                    <div class="rules-container">
                        <p class="rules-title">Password must contain:</p>

                        <ul class="rules">
                            <li class={ruleLength}>
                                <span class="icon"></span>
                                At least 6 characters
                            </li>
                            <li class={ruleNumber}>
                                <span class="icon"></span>
                                Contains a number
                            </li>
                            <li class={ruleUpper}>
                                <span class="icon"></span>
                                Contains uppercase letter
                            </li>
                            <li class={ruleSpecial}>
                                <span class="icon"></span>
                                Contains special character ($%@#!^&*)
                            </li>
                        </ul>
                    </div>

                    <div class="toggle">
                        <lightning-input
                            type="checkbox"
                            label="Show Password"
                            onchange={togglePassword}>
                        </lightning-input>
                    </div>

                    <button class="btn" onclick={handleSubmit}>
                        Set Password
                    </button>

                </template>
            </template>

            <!-- Error -->
            <template if:true={message}>
                <p class="error">{message}</p>
            </template>

        </div>
    </div>

    <!-- ✅ REAL MODAL (OUTSIDE CARD) -->
    <template if:true={showModal}>
        <div class="modal-backdrop">
            <div class="modal-container">

                <!-- Success Icon -->
                <div class="success-icon">
                    ✓
                </div>

                <!-- Title -->
                <h2 class="modal-title">Password Created!</h2>

                <!-- Message -->
                <p class="modal-text">
                    Your password has been successfully created. You can now use it to track your project progress in the Arelia mobile application. This page can now be safely closed.
                </p>

                <!-- Button -->
                <button class="modal-btn" onclick={closeModal}>
                    Close
                </button>

            </div>
        </div>
    </template>
</template>
