<template>
    <div class="catalog-root">
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>
        <div class="bg-shape shape-3"></div>
        <div class="ambient-glow"></div>

        <div class="main-container">
            <template if:false={isStep0}>
                <div class="stepper">
                    <div class={stepClass1}>
                        <span class="step-index">1</span>
                        <span class="step-label">Spaces</span>
                    </div>
                    <div class="step-line"></div>

                    <div class={stepClass2}>
                        <span class="step-index">2</span>
                        <span class="step-label">Category</span>
                    </div>
                    <div class="step-line"></div>

                    <div class={stepClass3}>
                        <span class="step-index">3</span>
                        <span class="step-label">Products</span>
                    </div>
                </div>
            </template>

            <template if:true={isStep0}>
                <template if:true={oppSummary}>
                    <section class="step-screen intro-center summary-hero-flat">
                        <div class="summary-glass-card">
                            <h1 class="summary-title-flat">Customer Information</h1>
                            <div class="summary-grid-flat">
                                <div class="summary-row-flat">
                                    <span class="label">Client Name</span>
                                    <span class="value">{oppSummary.Lead_Name__c}</span>
                                </div>
                                <div class="summary-row-flat">
                                    <span class="label">Email</span>
                                    <span class="value">{oppSummary.Email__c}</span>
                                </div>
                                <div class="summary-row-flat">
                                    <span class="label">Quotation Type</span>
                                    <span class="value highlight">{oppSummary.Project_Request_Quotation_Type__c}</span>
                                </div>
                                <template if:true={isManual}>
                                    <div class="summary-row-flat">
                                        <span class="label">Project Type</span>
                                        <span class="value">{oppSummary.Type_of_Project__c}</span>
                                    </div>
                                </template>
                                <template if:true={isAutomatic}>
                                    <div class="summary-row-flat">
                                        <span class="label">Interior Project</span>
                                        <span class="value">{interiorProjectTypeName}</span>
                                    </div>
                                </template>
                            </div>

                            <div class="summary-actions-flat">
                                <button type="button" class="luxury-btn primary-cta" onclick={goToStep1}>
                                    Proceed to Catalogue
                                </button>
                            </div>
                        </div>
                    </section>
                </template>

                <template if:false={oppSummary}>
                    <section class="step-screen intro-center">
                        <lightning-spinner size="medium" variant="brand"></lightning-spinner>
                    </section>
                </template>
            </template>

            <template if:true={isStep1}>
                <section class="step-screen intro-center">
                    <div class="catalog-header">
                        <button type="button" class="luxury-btn secondary-cta" onclick={handleBackClick}>
                            ← {backButtonLabel}
                        </button>
                        <button type="button" class="luxury-btn primary-cta" onclick={openCart}>
                            <lightning-icon icon-name="utility:cart" size="x-small" variant="inverse"></lightning-icon> {cartLabel}
                        </button>
                    </div>

                    <div class="intro-content">
                        <h1 class="heading">The Collection</h1>
                        <p class="subheading">Browse curated interior solutions and build your quotation effortlessly.</p>
                        <div class="divider-line"></div>
                        <div class="filter-label">Select Space</div>
                        <div class="chip-row">
                            <template for:each={roomTypesUI} for:item="room">
                                <button type="button" key={room.value} class={room.className} data-value={room.value} onclick={handleRoomSelect}>
                                    {room.value}
                                </button>
                            </template>
                        </div>
                    </div>
                </section>
            </template>

            <template if:true={isStep2}>
                <section class="step-screen fade-slide">
                    <div class="catalog-header">
                        <button type="button" class="luxury-btn secondary-cta" onclick={handleBackClick}>
                            ← {backButtonLabel}
                        </button>
                        <button type="button" class="luxury-btn primary-cta" onclick={openCart}>
                            <lightning-icon icon-name="utility:cart" size="x-small" variant="inverse"></lightning-icon> {cartLabel}
                        </button>
                    </div>

                    <div class="intro-content">
                        <div class="title-block">
                            <h2>{selectedRoomType}</h2>
                        </div>
                        <div class="divider-line"></div>
                        <div class="filter-label">Select Category</div>
                        <div class="chip-row">
                            <template for:each={categories} for:item="cat">
                                <button type="button" key={cat.value} class={cat.className} data-value={cat.value} onclick={handleCategorySelect}>
                                    {cat.value}
                                </button>
                            </template>
                        </div>
                    </div>
                </section>
            </template>

            <template if:true={isStep3}>
                <section class="step-screen fade-slide">
                    <div class="catalog-header">
                        <button type="button" class="luxury-btn secondary-cta" onclick={handleBackClick}>
                            ← {backButtonLabel}
                        </button>
                        <div class="title-block-inline">
                            <h2>{selectedRoomType} <span class="gold-divider">/</span> {selectedCategory}</h2>
                        </div>
                        <button type="button" class="luxury-btn primary-cta" onclick={openCart}>
                            <lightning-icon icon-name="utility:cart" size="x-small" variant="inverse"></lightning-icon> {cartLabel}
                        </button>
                    </div>

                    <template if:true={isLoading}>
                        <lightning-spinner size="medium" variant="brand"></lightning-spinner>
                    </template>

                    <template if:true={visibleProducts.length}>
                        <section class="cards-grid">
                            <template for:each={visibleProducts} for:item="prod">
                                <article key={prod.Id} class="product-card" data-product={prod.Id}>
                                    <div class="card-media">
                                        <img src={prod.imageUrl} data-url={prod.imageUrl} onclick={openImageModal} class="product-image-click"/>
                                    </div>
                                    <div class="card-body">
                                        <h3>{prod.Name}</h3>

                                        <div class="glass-radio-group" data-id={prod.Id} onchange={handleQualityRadio}>
                                            <input type="radio" name={prod.qualityGroupName} id={prod.standardId} value="Standard" checked={prod.isStandard}/>
                                            <label for={prod.standardId}>Standard</label>

                                            <input type="radio" name={prod.qualityGroupName} id={prod.premiumId} value="Premium" checked={prod.isPremium}/>
                                            <label for={prod.premiumId}>Premium</label>

                                            <input type="radio" name={prod.qualityGroupName} id={prod.luxuryId} value="Luxury" checked={prod.isLuxury}/>
                                            <label for={prod.luxuryId}>Luxury</label>
                                            <div class="glass-glider"></div>
                                        </div>

                                        <div class="price-value">₹ {prod.displayPrice}</div>

                                        <template if:false={prod.inCart}>
                                            <button type="button" class="luxury-btn add-cart-btn" data-id={prod.Id} onclick={handleAddToCart}>
                                                Add to Cart
                                            </button>
                                        </template>

                                        <template if:true={prod.inCart}>
                                            <div class="qty-wrapper">
                                                <button type="button" class="qty-circle minus" data-id={prod.Id} onclick={handleQtyMinus}>-</button>
                                                <input class="qty-center-input" type="number" value={prod.qty} min="1" data-id={prod.Id} onchange={handleQtyInput}/>
                                                <button type="button" class="qty-circle plus" data-id={prod.Id} onclick={handleQtyPlus}>+</button>
                                            </div>
                                        </template>
                                    </div>
                                </article>
                            </template>
                        </section>

                        <div class="pagination-controls">
                            <button type="button" class="nav-btn" onclick={prevPage} disabled={isFirstPage}>Previous</button>
                            <span>{currentPage} / {totalPages}</span>
                            <button type="button" class="nav-btn" onclick={nextPage} disabled={isLastPage}>Next</button>
                        </div>
                    </template>
                </section>
            </template>
        </div>

        <template if:true={isImageModalOpen}>
            <section class="image-modal-bg" onclick={closeImageModal}>
                <div class="image-modal-container" onclick={stopEvent}>
                    <img src={modalImageUrl} class="image-modal-img"/>
                    <button type="button" class="image-modal-close" onclick={closeImageModal}>×</button>
                </div>
            </section>
        </template>

        <template if:true={isCartOpen}>
            <section class="modal-backdrop">
                <div class="modal-panel">
                    <div class="cart-header-row">
                        <h2>Your Selection</h2>
                        <lightning-button-icon icon-name="utility:close" class="close-btn" variant="bare-inverse" size="large" onclick={closeCart}></lightning-button-icon>
                    </div>

                    <template if:true={cartItems.length}>
                        <div class="cart-body" onscroll={handleCartScroll}>
                            <template for:each={cartItems} for:item="item">
                                <div key={item.Id} class="cart-line-row">
                                    <div class="cart-line-left">
                                        <span class="cart-product-link" data-id={item.Interior_Product__c} onclick={handleSelectedProductClick}>
                                            {item.Quantity__c} × {item.Name}
                                        </span>
                                        <span class="quality-chip">{item.Quality__c}</span>
                                    </div>
                                    <div class="cart-line-right">
                                        <span class="price-text">₹ {item.Total_Amount__c}</span>
                                        <button type="button" class="remove-btn" title="Remove item" data-id={item.Id} data-productid={item.Interior_Product__c} onclick={handleRemoveItem}>
                                            <lightning-icon icon-name="utility:delete" size="xx-small" variant="error"></lightning-icon>
                                        </button>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <div class="cart-total-row">
                            <strong>Total Investment</strong>
                            <span class="cart-total">₹ {cartTotal}</span>
                            <div class="scroll-indicator" if:true={showScrollTop} onclick={scrollCartToTop} title="Scroll to top">
                                <span class="arrow">⌃</span>
                            </div>
                        </div>

                        <div class="modal-actions">
                            <button type="button" class="luxury-btn secondary-cta" onclick={closeCart}>Continue</button>
                            <button type="button" class="luxury-btn primary-cta" onclick={handleGenerateClick}>Generate Quote</button>
                        </div>
                        <div class="clear-btn-wrap">
                            <button type="button" class="remove-btn clear-all" onclick={handleClearCart}>Clear Cart</button>
                        </div>
                    </template>

                    <template if:false={cartItems.length}>
                        <div class="empty-state">
                            <lightning-icon icon-name="utility:cart" size="large" class="empty-cart-icon"></lightning-icon>
                            <p>Your selection is currently empty.</p>
                        </div>
                    </template>
                </div>
            </section>
        </template>

        <template if:true={showPopup}>
            <section class="toast-overlay">
                <div class="toast-box">
                    <span class="toast-title">{popupTitle}</span>
                    <p class="toast-msg">{popupMessage}</p>
                    <button type="button" class="luxury-btn primary-cta popup-close" onclick={closePopup}>Close</button>
                </div>
            </section>
        </template>

    </div>
</template>
