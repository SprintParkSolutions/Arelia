<template>
    <div class="reset-page">

        <section class="reset-card">
            <div class="card-header">
                <div class="header-badge">
                    Arelia Mobile Access
                </div>

                <h1 class="title">
                    Reset Your Password
                </h1>

                <p class="subtitle">
                    Create a new secure password to continue accessing your Arelia mobile application
                    and track your project progress.
                </p>
            </div>

            <div class="card-body">
                <template if:true={isValidToken}>
                    <template if:false={showModal}>
                        <div class="section-title-row">
                            <h2>Password Details</h2>
                            <span class="section-line"></span>
                        </div>

                        <div class="form-grid">
                            <div class="field-cell">
                                <lightning-input
                                    type={passwordType}
                                    label="New Password"
                                    value={password}
                                    onchange={handleChange}
                                    class="input"
                                    data-id="newPassword">
                                </lightning-input>
                            </div>

                            <div class="field-cell">
                                <lightning-input
                                    type={passwordType}
                                    label="Confirm Password"
                                    value={confirmPassword}
                                    onchange={handleConfirmChange}
                                    class="input"
                                    data-id="confirmPassword">
                                </lightning-input>
                            </div>
                        </div>

                        <div class="strength-panel">
                            <div class="strength-header">
                                <span>Password Strength</span>
                                <strong>{strengthText}</strong>
                            </div>

                            <div class="strength-bar">
                                <div class={strengthClass}></div>
                            </div>
                        </div>

                        <div class="rules-container">
                            <div class="rules-title-row">
                                <p class="rules-title">
                                    Password must contain
                                </p>
                                <span class="rules-line"></span>
                            </div>

                            <ul class="rules">
                                <li class={ruleLength}>
                                    <span class="icon"></span>
                                    <span>At least 6 characters</span>
                                </li>

                                <li class={ruleNumber}>
                                    <span class="icon"></span>
                                    <span>Contains a number</span>
                                </li>

                                <li class={ruleUpper}>
                                    <span class="icon"></span>
                                    <span>Contains uppercase letter</span>
                                </li>

                                <li class={ruleSpecial}>
                                    <span class="icon"></span>
                                    <span>Contains special character ($%@#!^&*)</span>
                                </li>
                            </ul>
                        </div>

                        <div class="toggle-panel">
                            <lightning-input
                                type="checkbox"
                                label="Show Password"
                                onchange={togglePassword}>
                            </lightning-input>
                        </div>

                        <template if:true={message}>
                            <div class="error-box">
                                {message}
                            </div>
                        </template>

                        <button class="btn" onclick={handleSubmit}>
                            Reset Password
                        </button>
                    </template>
                </template>

                <template if:false={isValidToken}>
                    <template if:true={message}>
                        <div class="status-box">
                            <div class="status-icon">!</div>

                            <p class="status-eyebrow">
                                Password Link Status
                            </p>

                            <h2>
                                Unable to Continue
                            </h2>

                            <p>
                                {message}
                            </p>
                        </div>
                    </template>
                </template>
            </div>
        </section>

        <template if:true={showModal}>
            <div class="modal-backdrop">
                <div class="modal-container">
                    <div class="success-icon">
                        ✓
                    </div>

                    <p class="modal-eyebrow">
                        Password Status
                    </p>

                    <h2 class="modal-title">
                        Password Updated!
                    </h2>

                    <p class="modal-text">
                        Your password has been successfully updated. You can now use it
                        to track your project progress in the Arelia mobile application.
                        This page can now be safely closed.
                    </p>

                    <button class="modal-btn" onclick={closeModal}>
                        Close
                    </button>
                </div>
            </div>
        </template>

    </div>
</template>
