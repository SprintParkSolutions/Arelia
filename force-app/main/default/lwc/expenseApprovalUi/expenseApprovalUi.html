<template>
    <div class="arelia-container">

        <template if:true={isLoading}>
            <lightning-spinner
                alternative-text="Processing..."
                size="medium"
                variant="brand"
                class="submit-spinner">
            </lightning-spinner>
        </template>

        <template if:true={error}>
            <div class="slds-notify slds-notify_alert slds-theme_error error-alert" role="alert">
                <h2>{error}</h2>
            </div>
        </template>

        <template if:true={sheet}>
            <div class="header-section slds-text-align_center slds-m-bottom_large animate-fade-in fade-delay-one">
                <h1 class="main-title">Expense Approval</h1>
                <p class="main-subtitle">Arelia Living Premium Portal</p>
            </div>

            <div class="arelia-card detail-summary-card slds-m-bottom_large animate-fade-in fade-delay-two">
                <div class="slds-grid slds-wrap">

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 project-details-col">
                        <div class="details-wrapper">
                            <h3 class="section-label">Project Details</h3>

                            <div class="detail-item">
                                <div class="icon-box">
                                    <lightning-icon icon-name="standard:home" size="small" alternative-text="Project"></lightning-icon>
                                </div>
                                <div class="info-content">
                                    <label>Project Name</label>
                                    <div class="value slds-truncate">{sheet.Project__r.Name}</div>
                                </div>
                            </div>

                            <div class="detail-item">
                                <div class="icon-box">
                                    <lightning-icon icon-name="standard:user" size="small" alternative-text="Client"></lightning-icon>
                                </div>
                                <div class="info-content">
                                    <label>Client Name</label>
                                    <div class="value slds-truncate">{sheet.Project__r.Client__r.Name}</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 budget-summary-col">
                        <div class="budget-wrapper">
                            <h3 class="section-label">Financial Summary</h3>
                            
                            <div class="final-row slds-m-top_large">
                                <label>Total Payable Amount</label>
                                <div class="big-number">
                                    <lightning-formatted-number
                                        value={sheet.Grand_Total__c}
                                        format-style="currency"
                                        currency-code="INR">
                                    </lightning-formatted-number>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <div class="arelia-card action-card slds-p-around_large slds-text-align_center animate-fade-in fade-delay-three">

                <template if:false={isProcessed}>
                    <div class="button-container">
                        <button class="arelia-btn btn-approve" onclick={handleApprove}>
                            <lightning-icon
                                icon-name="utility:check"
                                size="small"
                                class="button-icon approve-icon slds-m-right_x-small">
                            </lightning-icon>
                            Approve Expense
                        </button>
                    </div>
                </template>

                <template if:true={isProcessed}>
                    <div class="info-box">
                        <h2>Record Status: {finalStatus}</h2>
                        <p class="processed-message">This expense sheet has already been processed.</p>
                    </div>
                </template>
            </div>
        </template>

        <!-- NEW CONFIRMATION MODAL -->
        <template if:true={showConfirmModal}>
            <div class="custom-modal-backdrop">
                <section class="custom-modal-box animate-fade-in" role="dialog" aria-modal="true">
                    <h2 class="success-title">{confirmTitle}</h2>
                    <p class="success-message">{confirmMessage}</p>

                    <div class="button-container slds-m-top_medium">
                        <button class="arelia-btn btn-back" onclick={handleConfirmCancel}>
                            Cancel
                        </button>
                        <button class="arelia-btn btn-approve" onclick={handleConfirmProceed}>
                            Confirm
                        </button>
                    </div>
                </section>
            </div>
        </template>

        <!-- SUCCESS MODAL -->
        <template if:true={showSuccessModal}>
            <div class="custom-modal-backdrop">
                <section class="custom-modal-box" role="dialog" aria-modal="true">
                    <div class="success-icon">✓</div>
                    
                    <h2 class="success-title">Action Completed</h2>
                    
                    <p class="success-message">
                        The expense sheet for <b>{sheet.Project__r.Name}</b> has been <b>Approved</b>.
                    </p>

                    <button class="arelia-btn btn-approve return-btn" onclick={handleFinalClose}>
                        Return to Portal
                    </button>
                </section>
            </div>
        </template>
    </div>
</template>
