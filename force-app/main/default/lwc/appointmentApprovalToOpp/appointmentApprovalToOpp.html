<template>
    <section class="page">
        <!-- Subtle Ambient Background Blobs for Added Depth -->
        <div class="bg-glow"></div>
        
        <div class="outer">
            <div class="pageTitle">
                <h1>Review for Arelia Living – Site Re-Visit</h1>
                <div class="header-line"></div>
                <p class="pageSub">
                    Welcome. Please review your scheduled site visit details below. Once reviewed, kindly provide your
                    approval or request a reschedule using the options provided.
                </p>
            </div>

            <div class="card">
                <div class="cardHead">
                    <div class="brandIcon">
                        <lightning-icon icon-name="custom:custom63" size="small"></lightning-icon>
                    </div>
                    <div class="cardHeadText">
                        <div class="cardTitle">Submission Decision</div>
                        <div class="cardDesc">
                            Your response will be shared directly with our supervisory team. A confirmation email will follow.
                        </div>
                    </div>
                </div>

                <div class="appointment-details">
                    <div class="detail-item">
                        <div class="detail-icon">
                            <lightning-icon icon-name="utility:event" size="small"></lightning-icon>
                        </div>
                        <div class="detail-text">
                            <span class="detail-label">Scheduled Date</span>
                            <span class="detail-value">{formattedAppointmentDate}</span>
                        </div>
                    </div>
                    
                    <div class="detail-divider"></div>

                    <div class="detail-item">
                        <div class="detail-icon">
                            <lightning-icon icon-name="utility:clock" size="small"></lightning-icon>
                        </div>
                        <div class="detail-text">
                            <span class="detail-label">Scheduled Time</span>
                            <span class="detail-value">{displayAppointmentTime}</span>
                        </div>
                    </div>
                </div>

                <div class="whatBox">
                    <div class="whatTitle">Available Actions</div>
                    <ul class="whatList">
                        <li><b>Approve</b> — Secure and confirm the site visit at the scheduled date and time.</li>
                        <li><b>Reschedule</b> — Select a new, convenient date and time slot.</li>
                    </ul>
                </div>

                <!-- Hides these action buttons if the reschedule panel is currently active -->
                <template if:false={showReschedule}>
                    <div class="actions">
                        <button type="button" class="btn primary" onclick={onApproveClick} disabled={buttonsDisabled}>
                            Approve Visit
                        </button>
                        <button type="button" class="btn secondary" onclick={onRescheduleClick} disabled={buttonsDisabled}>
                            Reschedule
                        </button>
                    </div>
                </template>

                <template if:true={showReschedule}>
                    <div class="panel">
                        <div class="panelTitle">Reschedule appointment</div>
                        
                        <div class="note">
                            <lightning-icon icon-name="utility:info" size="x-small" class="noteIcon"></lightning-icon>
                            <div class="noteText">
                                Please select a new available date and time slot before submitting.
                            </div>
                        </div>

                        <div class="grid">
                            <div class="field">
                                <lightning-input
                                    type="date"
                                    label="New Date"
                                    min={minDate}
                                    value={selectedDate}
                                    onchange={handleDateChange}>
                                </lightning-input>
                            </div>

                            <div class="field">
                                <lightning-combobox
                                    name="TimeSlot"
                                    label="Time Slot"
                                    value={selectedTimeSlot}
                                    placeholder="Select a time slot"
                                    options={timeSlotOptions}
                                    onchange={handleTimeSlotChange}>
                                </lightning-combobox>
                            </div>
                        </div>

                        <div class="panelActions">
                            <button type="button" class="btn primary" onclick={onRescheduleSubmitClick} disabled={buttonsDisabled}>
                                Submit
                            </button>
                            <button type="button" class="btn ghost" onclick={cancelReschedule} disabled={buttonsDisabled}>
                                Cancel
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- CONFIRM MODAL -->
        <template if:true={showConfirm}>
            <div class="overlay" role="dialog" aria-modal="true" aria-labelledby="modal-confirm-title">
                <div class="modal">
                    <div id="modal-confirm-title" class="modalTitle">{confirmTitle}</div>
                    <div class="modalMsg">{confirmMessage}</div>

                    <div class="modalActions">
                        <button type="button" class="btn primary" onclick={confirmYes} disabled={confirmButtonsDisabled}>
                            <template if:false={isSubmitting}>Yes, Confirm</template>
                            <template if:true={isSubmitting}>
                                <span class="spinner"></span>
                                Processing…
                            </template>
                        </button>
                        <button type="button" class="btn ghost" onclick={confirmNo} disabled={confirmButtonsDisabled}>
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </template>

        <!-- THANK YOU MODAL -->
        <template if:true={showThankYou}>
            <div class="overlay" role="dialog" aria-modal="true" aria-labelledby="modal-thank-title">
                <div class="thank">
                    <div class="tick">
                        <lightning-icon icon-name="utility:success" size="small"></lightning-icon>
                    </div>

                    <div id="modal-thank-title" class="thankTitle">Thank you!</div>
                    <div class="thankMsg">
                        We have successfully received your response. Our team will contact you shortly if anything further is required. A confirmation email is on its way.
                    </div>

                    <div class="modalActions">
                        <button type="button" class="btn primary" onclick={handleClose}>Close</button>
                    </div>
                </div>
            </div>
        </template>
    </section>
</template>
